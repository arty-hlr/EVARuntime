# /etc/nginx/sites-available/llm-gateway
#
# Points critiques SSE (streaming) :
#   proxy_buffering off       — désactive le buffer nginx côté réponse
#   X-Accel-Buffering: no     — désactive le buffer nginx côté upstream
#   chunked_transfer_encoding — nécessaire pour le streaming HTTP/1.1
#   proxy_read_timeout 900s   — voir « Dimensionnement des timeouts » ci-dessous
#
# Dimensionnement des timeouts (COR-009) — DÉRIVÉ DU REGISTRE, pas d'un chiffre
# arbitraire. `ServerManager.ensure_loaded` attend `load_timeout_seconds + 10`
# (`MODEL_LOAD_TIMEOUT_SECONDS`, 180s, quand le modèle ne le surcharge pas). Le
# proxy doit couvrir cette attente, sinon le client reçoit 504 alors que le
# chargement RÉUSSIT côté serveur.
#   gateway/models.yaml, pire entrée ACTIVÉE  : gemma-4-26b-a4b, 300s → 310s
#   gateway/models.yaml, pire entrée TOUTES   : minimax-m2.7,    600s → 610s
#                                               (enabled: false, réactivable)
#   valeur retenue                            : 900s (≈ +48 % sur 610s)
# La marge couvre donc la réactivation de minimax-m2.7 sans retoucher nginx, et
# un stockage plus lent que prévu. `gateway/doctor.py` (contrôle
# `nginx_timeouts`) recalcule l'exigence depuis le registre et signale l'écart si
# un futur modèle dépasse ces 900s ; le test
# `tests/test_nginx_conf.py::test_les_timeouts_livres_couvrent_le_registre`
# échoue dans le même cas.
#
# Sécurité :
#   /admin/ est restreint au réseau campus (10.x.x.x / 192.168.x.x)
#   TLS 1.2+ uniquement
#   Headers de sécurité HTTP
#   Anti-slowloris : timeouts courts sur header/body du client
#   limit_conn borne les streams SSE concurrents par IP (DoS GPU)

upstream llm_gateway {
    server 127.0.0.1:8000;
    keepalive 32;
    keepalive_timeout 60s;
}

# Zone de rate-limiting nginx (defense-in-depth, complément au rate limiting applicatif)
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/m;
# Zone de limitation des connexions concurrentes (borne les streams SSE par IP)
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    # HTTP/2 : volontairement ABSENT de la conf livrée (OPS-009).
    # Aucune forme de la directive n'est acceptée par tout le socle supporté :
    #   - « listen … ssl http2 » est DÉPRÉCIÉ depuis nginx 1.25.1 → deux warnings
    #     à chaque `nginx -t` et à chaque reload, qui masquent le bruit utile ;
    #   - « http2 on; » n'existe PAS avant 1.25.1 → « unknown directive », le
    #     service refuse de démarrer sur Ubuntu 22.04 LTS (nginx 1.18) comme sur
    #     Ubuntu 24.04 LTS (nginx 1.24), les deux socles supportés.
    # Un `listen` nu est la seule écriture valide partout. Sur un hôte en nginx
    # >= 1.25.1 (vérifier avec `nginx -v`), décommenter « http2 on; » ci-dessous.
    # Voir docs/deployment.md §8.
    listen 443 ssl;
    listen [::]:443 ssl;
    # http2 on;
    server_name llm.eva.univ-pau.fr;

    # Certificat TLS fourni par la DSI UPPA (PKI interne)
    ssl_certificate     /etc/ssl/certs/llm-gateway.crt;
    ssl_certificate_key /etc/ssl/private/llm-gateway.key;

    # TLS moderne uniquement
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Taille max du body (prompts longs) — inchangé
    client_max_body_size 10m;

    # ── Anti-slowloris ────────────────────────────────────────────────────────
    # Un client doit envoyer ses headers et son body sans traîner. Ces timeouts
    # NE s'appliquent qu'à la RÉCEPTION de la requête client (pas au streaming de
    # la réponse, géré par proxy_read_timeout/proxy_send_timeout ci-dessous).
    client_header_timeout   15s;
    client_body_timeout     15s;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;

    # Headers de sécurité HTTP
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # ── Liste des modèles (/v1/models) ─────────────────────────────────────────
    # Route légère, non-streamante : rate-limit souple, PAS de limit_conn stricte
    # (une requête GET rapide ne doit pas consommer un slot de concurrence GPU).
    location = /v1/models {
        limit_req zone=api_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://llm_gateway;
        proxy_http_version 1.1;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ── API d'inférence streamante ────────────────────────────────────────────
    # Ces routes déclenchent l'inférence GPU et peuvent streamer (SSE) longtemps.
    # limit_conn borne les streams concurrents par IP → protège le GPU du DoS.
    #
    # `/completion` (sans préfixe /v1/) est l'endpoint natif llama.cpp documenté
    # en docs/api.md §7. Il est déclaré ICI parce qu'il tombait sinon dans le
    # « location / » de repli, qui renvoie 404 : la route était exposée par
    # FastAPI et documentée, mais injoignable à travers nginx (COR-009).
    location ~ ^(/v1/(chat/completions|completions|completion|embeddings)|/completion)$ {
        # Rate limiting nginx (60 req/min par IP, burst de 10)
        limit_req  zone=api_zone burst=10 nodelay;
        limit_req_status 429;
        # Max 4 requêtes d'inférence concurrentes par IP (borne les streams SSE)
        limit_conn api_conn 4;
        limit_conn_status 429;

        proxy_pass http://llm_gateway;

        # HTTP/1.1 requis pour le chunked transfer (streaming SSE)
        proxy_http_version 1.1;

        # CRITIQUE pour le streaming SSE : désactiver TOUT buffering
        proxy_buffering        off;
        proxy_cache            off;
        chunked_transfer_encoding on;

        # Signaler à nginx de ne pas bufferiser la réponse upstream
        add_header X-Accel-Buffering no always;

        # Timeouts généreux pour les inférences longues (NE PAS réduire : casserait
        # les générations longues et le streaming SSE). 900s : voir
        # « Dimensionnement des timeouts » en tête de fichier — une première
        # requête sur un modèle froid attend son chargement AVANT le 1er token.
        proxy_connect_timeout  10s;
        proxy_send_timeout     900s;
        proxy_read_timeout     900s;

        # Headers de forwarding
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connection keep-alive vers upstream
        proxy_set_header Connection "";
    }

    # ── Autres routes /v1/ (fallback : tokenize, rerank, etc.) ─────────────────
    # Conserve le comportement streaming/SSE d'origine par prudence, mais borné en
    # concurrence comme les routes d'inférence.
    location /v1/ {
        limit_req  zone=api_zone burst=10 nodelay;
        limit_req_status 429;
        limit_conn api_conn 4;
        limit_conn_status 429;

        proxy_pass http://llm_gateway;
        proxy_http_version 1.1;

        proxy_buffering        off;
        proxy_cache            off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;

        # Même dimensionnement que le bloc d'inférence : /v1/tokenize et
        # /v1/detokenize peuvent aussi déclencher un chargement de modèle.
        proxy_connect_timeout  10s;
        proxy_send_timeout     900s;
        proxy_read_timeout     900s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ── Health check (pas de rate limit, pas de log) ──────────────────────
    location /health {
        proxy_pass         http://llm_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        access_log         off;
    }

    # ── Readiness (non authentifiée, documentée en docs/api.md §2) ────────
    # Sonde distincte de /health : elle dit si la gateway peut SERVIR maintenant.
    # Elle tombait dans le « location / » de repli (404) alors que la doc
    # utilisateur l'annonce sur l'URL publique (COR-009).
    #
    # Non-divulgation : le corps public ne contient que des identifiants de
    # contrôle et des codes stables — aucun chemin de GGUF, aucune URL de nœud.
    # Le détail actionnable exige ADMIN_SECRET et reste donc protégé côté
    # applicatif. Rate-limitée pour qu'une sonde publique ne devienne pas un
    # levier de charge ; access_log coupé, un load balancer l'appelle en boucle.
    location = /ready {
        limit_req zone=api_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://llm_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";

        # Contrôles structurels uniquement (stat de fichiers, arithmétique VRAM) :
        # aucun chargement de modèle, donc pas de timeout long à prévoir.
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        access_log off;
    }

    # ── Admin (réseau campus uniquement) ──────────────────────────────────
    location /admin/ {
        # Restreindre aux plages IP du campus UPPA
        # Adapter ces plages à la configuration réseau réelle
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny  all;

        proxy_pass         http://llm_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";

        # 900s et NON 30s (COR-009) : POST /admin/models/{id}/load attend le
        # chargement complet du modèle, jusqu'à 610s avec le registre livré. À
        # 30s, le bouton « Load » du dashboard affichait un 504 alors que le
        # chargement réussissait côté serveur. Voir « Dimensionnement des
        # timeouts » en tête de fichier.
        proxy_connect_timeout  10s;
        proxy_send_timeout     900s;
        proxy_read_timeout     900s;
    }

    # Bloquer tout le reste
    location / {
        return 404;
    }
}

# ── Redirection HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name llm.eva.univ-pau.fr;

    location / {
        return 301 https://$host$request_uri;
    }
}
